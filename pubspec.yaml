name: suit_configuration_app
description: Flutter-App zur Konfiguration von Anzuegen mit Signatur und E-Mail-Bestaetigung.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  mailer: ^7.1.0
  path_provider: ^2.1.5
  signature: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
