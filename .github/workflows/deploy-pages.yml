name: Deploy Flutter Web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/suit-configuration-app-a05a

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Ensure web platform files exist
        run: flutter create . --platforms=web

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web for Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/suit-configuration-app-a05a'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages_check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('GET /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('enabled', 'true');
              core.info('GitHub Pages is enabled.');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('enabled', 'false');
                core.warning('GitHub Pages is not enabled. Deployment will be skipped.');
              } else {
                throw error;
              }
            }

      - name: Skip deploy when Pages is disabled
        if: steps.pages_check.outputs.enabled != 'true'
        run: echo "GitHub Pages disabled -> skipping deploy step."

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
